<script>
// Password override for VP Personal Hack
(function() {
    const CORRECT_PASS = "017728";
    function setupAuth() {
        const btn = document.getElementById("authSubmitBtn");
        const input = document.getElementById("authPasswordInput");
        const msg = document.getElementById("authMsg");
        const overlay = document.getElementById("authOverlay");
        if (!btn || !input) {
            setTimeout(setupAuth, 200);
            return;
        }
        // Remove existing listeners by cloning
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        newBtn.addEventListener("click", function() {
            const val = input.value.trim();
            if (val === CORRECT_PASS) {
                if (msg) msg.textContent = "ACCESS GRANTED";
                if (overlay) overlay.style.display = "none";
                // Trigger unlock if possible
                const event = new Event("authSuccess");
                document.dispatchEvent(event);
                // Try to call any unlock function
                if (typeof window.unlockVault === "function") window.unlockVault();
                // Force hide overlay and show content
                setTimeout(() => {
                    if (overlay) overlay.style.display = "none";
                    const root = document.getElementById("elite-vault-root");
                    if (root) root.style.pointerEvents = "auto";
                }, 100);
            } else {
                if (msg) {
                    msg.textContent = "INVALID KEY";
                    msg.style.color = "#ff4444";
                }
                input.value = "";
            }
        });
        // Also allow Enter key
        input.addEventListener("keypress", function(e) {
            if (e.key === "Enter") newBtn.click();
        });
    }
    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", setupAuth);
    } else {
        setupAuth();
    }
})();
</script>
